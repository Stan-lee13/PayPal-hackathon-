# Render Blueprint for Kept. Database: use Neon (free tier does not expire);
# paste its connection string into DATABASE_URL in the Render dashboard.
services:
  - type: web
    name: kept
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: KEPT_AI_MODEL
        value: claude-opus-5-5
      - key: MERCHANT_PASSCODE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: RECONCILE_AFTER_MINUTES
        value: "2"
