# Real-Postgres acceptance: migrations, concurrency, the whole suite, and the builds a release needs.
#
# Why this workflow exists: every other test in this repository can run against one serialized database
# connection, which cannot show whether the advisory locks, the unique indexes and the settlement claim
# actually hold when two payments overlap. This workflow runs the gateway against a real PostgreSQL service
# with a real connection pool, applies the migration sequence to a clean database, upgrades a database that
# is already at migration 0009, and only then runs the suite.
#
# Two rules it enforces, both learned from a run that looked green and was not:
#
#   • a pipeline's exit status is not the test runner's. Every test step sets `pipefail` (and `-euo`), so a
#     failing vitest cannot be hidden by a successful `tee`.
#   • a summary line is not evidence. Test counts and failures are read from vitest's JSON report, and the
#     job fails if anything failed, anything was skipped, or nothing ran.
#
# Supported PostgreSQL versions: 16 and 18. Both are exercised here as a matrix, because a local run on one
# version is not evidence about the other, and because the JSON/aggregate behaviour the accounting relies on
# must hold on both. See docs/MILESTONE_3_2_STATE_MACHINE_AUDIT.md.

name: postgres-acceptance

on:
  push:
    branches: ["main", "freebuff/**"]
  pull_request:
  workflow_dispatch:

# Job-level, because `matrix` is not available in a workflow-level concurrency group.
jobs:
  acceptance:
    concurrency:
      group: postgres-acceptance-${{ github.ref }}-${{ matrix.postgres }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: envelope
          POSTGRES_PASSWORD: envelope
          POSTGRES_DB: envelope_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U envelope -d envelope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://envelope:envelope@127.0.0.1:5432/envelope_test
      DATABASE_URL: postgres://envelope:envelope@127.0.0.1:5432/envelope_test
      DB_POOL_MAX: "8"
      PGPASSWORD: envelope
      CI: "true"
      # A missing database must fail the run, not silently skip the suites that need one.
      REQUIRE_TEST_DB: "1"
      # Opts the concurrency suite in. Its preflight fails the run if this is not a real multi-connection server.
      REAL_DATABASE_URL: postgres://envelope:envelope@127.0.0.1:5432/envelope_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install from the lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: Wait for Postgres
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U envelope -d envelope_test && break
            sleep 1
          done
          psql "$DATABASE_URL" -c "select version();"

      - name: Clean installation — the whole migration sequence on an empty database
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "drop schema if exists public cascade; drop schema if exists drizzle cascade; create schema public;"
          npm run db:migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "\dt" | tee /tmp/tables.txt
          grep -q "position_entries" /tmp/tables.txt
          grep -q "rail_accounts" /tmp/tables.txt
          grep -q "reconciliation_runs" /tmp/tables.txt
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select settle_generation, settling_at, rail_provider from spends limit 1;"

      - name: Upgrade — a database already at migration 0009 reaches the head without losing records
        shell: bash
        run: |
          set -euo pipefail
          node scripts/migration-upgrade-check.mjs

      - name: Multi-connection concurrency acceptance (must actually execute)
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run tests/concurrency.postgres.test.ts --reporter=verbose --reporter=json --outputFile=/tmp/concurrency.json 2>&1 | tee /tmp/concurrency.log
          # A skipped suite is not a pass: every concurrency test must have run and passed. The suite replaces
          # itself with a single "is not being exercised in this run" test when the server or pool is not real.
          node -e '
            const r = require("/tmp/concurrency.json");
            const tests = (r.testResults ?? []).flatMap((f) => f.assertionResults ?? []);
            const passed = r.numPassedTests ?? 0, failed = r.numFailedTests ?? 0, pending = r.numPendingTests ?? 0;
            const stand_in = tests.filter((t) => /not being exercised/.test(t.title ?? ""));
            console.log(`concurrency: ${tests.length} tests, ${passed} passed, ${failed} failed, ${pending} skipped`);
            if (!r.success || failed > 0 || pending > 0 || passed < 8 || stand_in.length > 0) {
              console.error("The concurrency suite did not run cleanly on a real multi-connection database.");
              process.exit(1);
            }
          '

      - name: Whole suite against real Postgres (several connections)
        shell: bash
        run: |
          set -euo pipefail
          # `pipefail` is what makes this step fail when vitest fails; the JSON report is what the next step reads.
          npx vitest run --reporter=default --reporter=json --outputFile=/tmp/suite.json 2>&1 | tee /tmp/suite.log

      # Runs after a failure as well as after a pass, and before the assertion step, because the assertion step is
      # skipped once the suite fails. Without this, a failing matrix job says only "Process completed with exit
      # code 1" and the test that failed is sealed inside an artifact that needs an authenticated download.
      - name: Name the failing tests, where anyone can read them
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          # No `-e`: a reporter that could fail would be able to replace the failure it is describing.
          node scripts/ci-failure-report.mjs

      - name: Assert the whole suite ran, nothing failed, nothing was skipped
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const r = require("/tmp/suite.json");
            const files = r.testResults?.length ?? 0;
            const passed = r.numPassedTests ?? 0, failed = r.numFailedTests ?? 0, pending = r.numPendingTests ?? 0;
            console.log(`suite: ${files} files, ${passed} passed, ${failed} failed, ${pending} skipped`);
            if (files < 20) { console.error("Far fewer test files ran than the repository has."); process.exit(1); }
            if (failed > 0 || pending > 0 || !r.success) { console.error("The suite reported failures or skips."); process.exit(1); }
            if (passed === 0) { console.error("No test passed; the database suites cannot have run."); process.exit(1); }
          '

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run lint

      - name: Next.js production build
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: SDK build
        shell: bash
        run: |
          set -euo pipefail
          npm run sdk:build

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-acceptance-logs-pg${{ matrix.postgres }}
          path: |
            /tmp/concurrency.log
            /tmp/suite.log
            /tmp/suite.json
            /tmp/concurrency.json
          if-no-files-found: ignore
